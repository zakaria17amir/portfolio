<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Page not found — Amir Abdullah Zakaria</title>
    <meta name="description" content="That page does not exist on this site." />
    <meta name="robots" content="noindex" />

    <!--
      NOTE: this is the ONE file that uses absolute paths.
      GitHub Pages serves 404.html for any unmatched URL, and the browser
      resolves relative paths against the URL that was REQUESTED, not against
      this file's location. A relative "assets/css/style.css" would therefore
      break on any path deeper than the site root.

      If you move to a custom domain, change the three /portfolio/ prefixes
      below to /.
    -->
    <link rel="icon" href="/portfolio/assets/img/favicon.svg" type="image/svg+xml" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode or blocked storage: fall through to the light default */
        }
      })();
    </script>

    <link rel="stylesheet" href="/portfolio/assets/css/style.css" />
  </head>

  <body
    class="flex min-h-screen flex-col bg-surface font-sans text-ink antialiased dark:bg-surface-dark dark:text-ink-dark"
  >
    <main class="mx-auto flex w-full max-w-3xl flex-1 flex-col justify-center px-5 py-20 sm:px-8">
      <p class="font-mono text-sm text-muted dark:text-muted-dark">404</p>
      <h1 class="mt-3 text-[clamp(1.875rem,5vw,3rem)] font-bold leading-[1.1] tracking-[-0.02em]">
        Page not found
      </h1>
      <p class="measure mt-4 text-lg leading-[1.6] text-muted dark:text-muted-dark">
        That page does not exist on this site. It may have been renamed, or the
        link may be incomplete.
      </p>
      <p class="mt-8">
        <a
          href="/portfolio/"
          class="rounded-md bg-accent px-4 py-2.5 text-sm font-medium text-white hover:bg-accent/90 dark:bg-accent-dark dark:text-surface-dark dark:hover:bg-accent-dark/90"
          >Go to the homepage</a
        >
      </p>
    </main>

    <footer class="border-t border-line dark:border-line-dark">
      <div class="mx-auto max-w-3xl px-5 py-8 text-sm text-muted sm:px-8 dark:text-muted-dark">
        <p>© 2026 Amir Abdullah Zakaria</p>
      </div>
    </footer>
  </body>
</html>
